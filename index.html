<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>업무 대시보드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f3;color:#1a1a1a;font-size:14px}
@keyframes spin{to{transform:rotate(360deg)}}
#loading-screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:#f5f5f3;z-index:999}
#loading-screen .spinner{width:32px;height:32px;border:3px solid #e8e8e8;border-top-color:#3b5bdb;border-radius:50%;animation:spin .8s linear infinite}
#loading-screen p{font-size:14px;color:#aaa}
.app{max-width:960px;margin:0 auto;padding:20px 16px;opacity:0;transition:opacity .3s}
.app.ready{opacity:1}
.top-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.top-bar h1{font-size:17px;font-weight:500}
.top-bar .date{font-size:12px;color:#999}
.tabs{display:flex;gap:0;border-bottom:1.5px solid #e8e8e8;margin-bottom:20px}
.tab{font-size:13px;padding:8px 18px;cursor:pointer;color:#999;border-bottom:2px solid transparent;margin-bottom:-1.5px;transition:all .15s;background:none;border-top:none;border-left:none;border-right:none}
.tab:hover{color:#444}.tab.active{color:#3b5bdb;border-bottom-color:#3b5bdb;font-weight:500}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
.metric{background:#fff;border-radius:10px;padding:12px 14px;border:.5px solid #e8e8e8}
.metric .lbl{font-size:11px;color:#aaa;margin-bottom:3px}.metric .val{font-size:22px;font-weight:500}
.metric .sub{font-size:11px;color:#ccc;margin-top:1px}
.filters{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.filter-btn{font-size:12px;padding:4px 13px;border-radius:20px;border:.5px solid #ddd;background:transparent;cursor:pointer;color:#666;transition:all .12s}
.filter-btn.active{background:#eff4ff;color:#3b5bdb;border-color:#a5b4fc}
.filter-btn:hover:not(.active){background:#f5f5f5}
.sort-select{margin-left:auto;font-size:12px;padding:4px 10px;border-radius:8px;border:.5px solid #ddd;background:#fff;color:#666;cursor:pointer}
.sec-title{font-size:11px;font-weight:500;color:#aaa;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;display:flex;align-items:center;gap:5px}
.task-list{display:flex;flex-direction:column;gap:5px;margin-bottom:16px}
.task{background:#fff;border:.5px solid #e8e8e8;border-radius:10px;padding:10px 13px;display:flex;align-items:center;gap:10px;transition:border-color .12s}
.task:hover{border-color:#ccc}.task.urgent{border-left:3px solid #e24b4a}.task.done{opacity:.38}
.checkbox{width:17px;height:17px;border-radius:5px;border:1.5px solid #ddd;flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s}
.checkbox.checked{background:#22c55e;border-color:#22c55e}
.task-body{flex:1;min-width:0}
.task-title{font-size:13px;color:#1a1a1a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px}
.task.done .task-title{text-decoration:line-through}
.task-meta{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.tag{font-size:11px;padding:2px 8px;border-radius:20px;white-space:nowrap}
.tag-coupang{background:#e6f1fb;color:#185fa5}.tag-store{background:#eaf3de;color:#3b6d11}
.tag-olive{background:#fbeaf0;color:#993556}.tag-mall{background:#eeedfe;color:#3c3489}
.tag-etc{background:#f1efe8;color:#5f5e5a}.tag-crm{background:#faeeda;color:#854f0b}
.due{font-size:11px;color:#bbb;display:flex;align-items:center;gap:2px}
.due.today{color:#e24b4a;font-weight:500}
.prio{font-size:12px;white-space:nowrap;flex-shrink:0}
.urgent-badge{font-size:10px;padding:2px 7px;background:#fcebeb;color:#a32d2d;border-radius:20px}
.add-btn{width:100%;padding:9px;border:1px dashed #ddd;border-radius:10px;background:transparent;cursor:pointer;font-size:13px;color:#aaa;display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:20px;transition:all .15s}
.add-btn:hover{background:#fafafa;color:#666;border-color:#bbb}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.card{background:#fff;border:.5px solid #e8e8e8;border-radius:12px;padding:16px}
.card-title{font-size:11px;font-weight:500;color:#aaa;text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px}
.channel-row{display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:.5px solid #f5f5f5}
.channel-row:last-child{border-bottom:none}
.ch-left{display:flex;align-items:center;gap:8px;flex:1}.ch-name{font-size:13px;color:#333}
.ch-bar-wrap{flex:1;margin:0 8px}.ch-bar{height:4px;border-radius:2px;background:#f0f0f0;overflow:hidden}
.ch-bar-fill{height:100%;border-radius:2px}.ch-count{font-size:12px;color:#aaa;white-space:nowrap}
.pj-block{background:#fff;border:.5px solid #e8e8e8;border-radius:12px;margin-bottom:12px;overflow:hidden}
.pj-head{padding:14px 16px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;transition:background .12s;border-bottom:.5px solid #f0f0f0}
.pj-head:hover{background:#fafafa}
.pj-head-left{display:flex;align-items:center;gap:10px}.pj-color-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.pj-name{font-size:14px;font-weight:500}.pj-channel-tag{font-size:11px;padding:2px 8px;border-radius:20px}
.pj-head-right{display:flex;align-items:center;gap:10px}
.pj-prog-bar{width:70px;height:4px;background:#f0f0f0;border-radius:2px;overflow:hidden}
.pj-prog-fill{height:100%;border-radius:2px}.pj-pct{font-size:12px;color:#aaa;min-width:28px;text-align:right}
.chevron{font-size:14px;color:#bbb;transition:transform .2s}.chevron.open{transform:rotate(180deg)}
.pj-body.collapsed{display:none}
.pj-cols{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0;border-top:.5px solid #f5f5f5}
.pj-col{padding:12px 14px;border-right:.5px solid #f5f5f5}.pj-col:last-child{border-right:none}
.pj-col-title{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.04em;margin-bottom:10px;display:flex;align-items:center;gap:5px}
.pj-col-title.last-week{color:#aaa}.pj-col-title.this-week{color:#3b5bdb}.pj-col-title.next-week{color:#22c55e}
.pj-task-row{display:flex;align-items:flex-start;gap:7px;padding:5px 0;border-bottom:.5px solid #f8f8f8}
.pj-task-row:last-child{border-bottom:none}
.pj-cb{width:15px;height:15px;border-radius:4px;border:1.5px solid #ddd;flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s}
.pj-cb.checked{background:#22c55e;border-color:#22c55e}
.pj-task-text{font-size:12px;color:#333;line-height:1.5;flex:1}
.pj-task-text.done{text-decoration:line-through;color:#bbb}
.pj-task-meta{display:flex;gap:4px;margin-top:2px;flex-wrap:wrap}
.pj-due{font-size:10px;color:#bbb}.pj-due.today{color:#e24b4a}
.pj-urgent{font-size:10px;padding:1px 6px;background:#fcebeb;color:#a32d2d;border-radius:20px}
.pj-empty{font-size:12px;color:#ccc;padding:6px 0;font-style:italic}
.pj-add-row{display:flex;align-items:center;gap:6px;padding:6px 0;cursor:pointer;color:#bbb;font-size:12px}
.pj-add-row:hover{color:#888}
.pj-blocker{display:flex;align-items:center;gap:6px;padding:6px 14px;background:#fff8f8;border-top:.5px solid #fee;font-size:12px;color:#a32d2d}
.meeting-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px}
.meeting-header h2{font-size:15px;font-weight:500}
.week-range{font-size:12px;color:#999;background:#f5f5f3;padding:4px 12px;border-radius:20px}
.print-btn{font-size:12px;padding:6px 14px;border:.5px solid #ddd;border-radius:8px;background:#fff;cursor:pointer;color:#666;display:flex;align-items:center;gap:5px}
.print-btn:hover{background:#f5f5f5}
.subtabs{display:flex;gap:6px;margin-bottom:16px}
.subtab{font-size:12px;padding:5px 14px;border-radius:20px;border:.5px solid #ddd;background:transparent;cursor:pointer;color:#666;transition:all .12s}
.subtab.active{background:#eff4ff;color:#3b5bdb;border-color:#a5b4fc}
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.cal-nav h2{font-size:15px;font-weight:500}
.cal-nav-btn{padding:5px 12px;border:.5px solid #ddd;border-radius:8px;background:#fff;cursor:pointer;font-size:13px;color:#666}
.cal-day-headers{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:3px}
.cal-day-header{font-size:11px;color:#aaa;text-align:center;padding:4px 0;font-weight:500}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-cell{min-height:86px;background:#fff;border:.5px solid #e8e8e8;border-radius:8px;padding:6px 5px}
.cal-cell.empty{background:transparent;border-color:transparent}
.cal-cell.today{border-color:#3b5bdb;background:#f8f9ff}
.cal-cell.sun .cal-day-num{color:#e24b4a}.cal-cell.sat .cal-day-num{color:#3b5bdb}
.cal-day-num{font-size:12px;color:#888;margin-bottom:4px;font-weight:500}
.cal-cell.today .cal-day-num{color:#3b5bdb;font-weight:700}
.todo-dot{font-size:11px;padding:2px 5px;border-radius:4px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.4}
.promo-bar{font-size:10px;padding:2px 5px;border-radius:3px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.5;cursor:pointer;font-weight:500}
.promo-bar.start{border-radius:4px 0 0 4px;padding-left:6px}.promo-bar.middle{border-radius:0}
.promo-bar.end{border-radius:0 4px 4px 0}.promo-bar.solo{border-radius:4px}
.cal-more{font-size:10px;color:#aaa;margin-top:2px}
.legend{display:flex;gap:14px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.legend-item{display:flex;align-items:center;gap:5px;font-size:12px;color:#666}
.legend-dot{width:10px;height:10px;border-radius:2px;flex-shrink:0}
.promo-detail{background:#fff;border:.5px solid #e8e8e8;border-radius:12px;padding:16px;margin-bottom:16px;display:none}
.promo-detail.open{display:block}
.promo-detail-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px}
.promo-detail-title{font-size:15px;font-weight:500}
.promo-detail-close{background:none;border:none;cursor:pointer;color:#aaa;font-size:18px;padding:0}
.promo-detail-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.promo-kv{background:#f8f8f8;border-radius:8px;padding:10px 12px}
.promo-kv .k{font-size:11px;color:#aaa;margin-bottom:3px}.promo-kv .v{font-size:13px;font-weight:500}
.promo-kv .v.goal{color:#3b5bdb}
.goal-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:3px 8px;border-radius:20px;font-weight:500}
.goal-yes{background:#eff4ff;color:#3b5bdb}.goal-no{background:#f5f5f3;color:#aaa}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:100;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:#fff;border-radius:14px;padding:24px;width:460px;max-width:92vw;max-height:90vh;overflow-y:auto}
.modal h3{font-size:15px;font-weight:500;margin-bottom:18px}
.form-group{margin-bottom:13px}
.form-group label{font-size:12px;color:#888;display:block;margin-bottom:5px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:8px 10px;border:.5px solid #ddd;border-radius:8px;font-size:13px;background:#fff;color:#1a1a1a;outline:none;transition:border-color .15s}
.form-group input:focus,.form-group select:focus{border-color:#a5b4fc}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.btn{padding:8px 18px;border-radius:8px;font-size:13px;cursor:pointer;border:.5px solid #ddd;background:transparent;color:#666}
.btn:hover{background:#f5f5f5}.btn.primary{background:#3b5bdb;color:#fff;border-color:#3b5bdb}
.btn.primary:hover{background:#3451c7}
.modal-tabs{display:flex;gap:0;border-bottom:1.5px solid #eee;margin-bottom:16px}
.modal-tab{font-size:13px;padding:6px 14px;cursor:pointer;color:#aaa;border-bottom:2px solid transparent;margin-bottom:-1.5px;background:none;border-top:none;border-left:none;border-right:none}
.modal-tab.active{color:#3b5bdb;border-bottom-color:#3b5bdb}
.modal-form-panel{display:none}.modal-form-panel.active{display:block}
.hidden{display:none!important}
@media print{.tabs,.filters,.add-btn,.print-btn,.modal-overlay{display:none!important}body{background:#fff}.pj-body.collapsed{display:block!important}.pj-block{break-inside:avoid}}
</style>
</head>
<body>

<div id="loading-screen">
  <div class="spinner"></div>
  <p>시트 데이터 불러오는 중...</p>
</div>

<div class="app" id="main-app">
<div class="top-bar"><h1>업무 대시보드</h1><span class="date" id="today-label"></span></div>
<div class="tabs">
  <button class="tab active" onclick="switchTab('dashboard',this)">대시보드</button>
  <button class="tab" onclick="switchTab('projects',this)">주간 보고</button>
  <button class="tab" onclick="switchTab('calendar',this)">캘린더</button>
</div>

<!-- DASHBOARD -->
<div id="tab-dashboard">
  <div class="metrics">
    <div class="metric"><div class="lbl">이번 주 전체</div><div class="val" id="m-total">0</div><div class="sub">할 일</div></div>
    <div class="metric"><div class="lbl">완료</div><div class="val" id="m-done" style="color:#22c55e">0</div><div class="sub" id="m-pct">0%</div></div>
    <div class="metric"><div class="lbl">마감 임박</div><div class="val" id="m-due" style="color:#e24b4a">0</div><div class="sub">오늘 / 내일</div></div>
    <div class="metric"><div class="lbl">긴급 추가</div><div class="val" id="m-urgent" style="color:#e8a020">0</div><div class="sub">치고 들어온 것</div></div>
  </div>
  <div class="filters">
    <button class="filter-btn active" onclick="filterDash('all',this)">전체</button>
    <button class="filter-btn" onclick="filterDash('todo',this)">미완료</button>
    <button class="filter-btn" onclick="filterDash('urgent',this)">긴급</button>
    <button class="filter-btn" onclick="filterDash('자사몰',this)">자사몰</button>
    <button class="filter-btn" onclick="filterDash('쿠팡',this)">쿠팡</button>
    <button class="filter-btn" onclick="filterDash('올리브영',this)">올리브영</button>
    <button class="filter-btn" onclick="filterDash('스마트스토어',this)">스마트스토어</button>
    <select class="sort-select" onchange="sortTasks(this.value)"><option value="due">마감일순</option><option value="prio">우선순위순</option><option value="channel">채널순</option></select>
    <button onclick="openModal('task')" style="font-size:12px;padding:5px 13px;border-radius:20px;border:.5px solid #3b5bdb;background:#eff4ff;color:#3b5bdb;cursor:pointer;display:flex;align-items:center;gap:4px;white-space:nowrap;flex-shrink:0"><i class="ti ti-plus" style="font-size:12px"></i> 할 일 추가</button>
  </div>
  <div class="sec-title" style="color:#e24b4a"><i class="ti ti-alert-circle" style="font-size:13px"></i> 긴급 / 마감 임박</div>
  <div class="task-list" id="urgent-list"></div>
  <div class="sec-title"><i class="ti ti-list-check" style="font-size:13px"></i> 이번 주 할 일</div>
  <div class="task-list" id="main-list"></div>
  <div class="two-col">
    <div class="card"><div class="card-title">채널별 진행현황</div><div id="channel-stats"></div></div>
    <div class="card"><div class="card-title">프로젝트별 현황</div><div id="project-summary"></div></div>
  </div>
</div>

<!-- WEEKLY REPORT -->
<div id="tab-projects" class="hidden">
  <div class="meeting-header">
    <div><h2>주간 보고</h2><div class="week-range" id="week-range-label" style="margin-top:6px;display:inline-block"></div></div>
    <div style="display:flex;gap:8px;align-items:center">
      <button class="print-btn" onclick="window.print()"><i class="ti ti-printer" style="font-size:13px"></i> 인쇄 / PDF</button>
      <button class="add-btn" style="width:auto;margin:0;padding:6px 14px" onclick="openModal('task')"><i class="ti ti-plus"></i> 추가</button>
    </div>
  </div>
  <div id="project-list"></div>
</div>

<!-- CALENDAR -->
<div id="tab-calendar" class="hidden">
  <div class="subtabs">
    <button class="subtab active" onclick="switchCalTab('todo',this)">투두 캘린더</button>
    <button class="subtab" onclick="switchCalTab('promo',this)">일정 캘린더</button>
  </div>
  <div class="cal-nav">
    <button class="cal-nav-btn" onclick="changeMonth(-1)"><i class="ti ti-chevron-left"></i></button>
    <h2 id="cal-title"></h2>
    <button class="cal-nav-btn" onclick="changeMonth(1)"><i class="ti ti-chevron-right"></i></button>
  </div>
  <div id="cal-todo">
    <div class="cal-day-headers" id="cal-headers-todo"></div>
    <div class="cal-grid" id="cal-body-todo"></div>
  </div>
  <div id="cal-promo" class="hidden">
    <div class="legend">
      <span style="font-size:12px;color:#888;font-weight:500">색상 기준</span>
      <div class="legend-item"><div class="legend-dot" style="background:#3b5bdb"></div>목표 있음 (리소스 집중)</div>
      <div class="legend-item"><div class="legend-dot" style="background:#bbb"></div>목표 없음 (참고용)</div>
    </div>
    <div id="promo-detail-panel" class="promo-detail"></div>
    <div class="cal-day-headers" id="cal-headers-promo"></div>
    <div class="cal-grid" id="cal-body-promo"></div>
    <button class="add-btn" style="margin-top:12px" onclick="openModal('promo')"><i class="ti ti-calendar-plus"></i> 일정 추가</button>
  </div>
</div>
</div><!-- /app -->

<!-- MODAL -->
<div class="modal-overlay" id="modal" onclick="closeModalOutside(event)">
  <div class="modal">
    <div class="modal-tabs">
      <button class="modal-tab active" id="mtab-task" onclick="switchModalTab('task',this)">할 일 추가</button>
      <button class="modal-tab" id="mtab-promo" onclick="switchModalTab('promo',this)">일정 추가</button>
    </div>
    <div class="modal-form-panel active" id="mpanel-task">
      <div class="form-group"><label>업무 내용</label><input type="text" id="f-title" placeholder="예) [자사몰] CRM 발송 예약"></div>
      <div class="form-row">
        <div class="form-group"><label>채널</label><select id="f-channel"><option>자사몰</option><option>쿠팡</option><option>올리브영</option><option>스마트스토어</option><option>기타</option></select></div>
        <div class="form-group"><label>프로젝트</label><select id="f-project"><option>자사몰 리뉴얼</option><option>쿠팡 광고 운영</option><option>올리브영 광고</option><option>CRM 운영</option><option>신제품 런칭</option><option>기타</option></select></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>마감일</label><input type="date" id="f-due"></div>
        <div class="form-group"><label>우선순위</label><select id="f-prio"><option value="4">🔵🔵🔵🔵 매출 직결</option><option value="3">🔵🔵🔵 팀 대기중</option><option value="2">🔵🔵 나만 영향</option><option value="1">🔵 언젠가</option></select></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>긴급?</label><select id="f-urgent"><option value="false">아니오</option><option value="true">예 (긴급)</option></select></div>
        <div class="form-group"><label>블로커</label><input type="text" id="f-blocker" placeholder="없으면 비워두기"></div>
      </div>
      <p style="font-size:11px;color:#aaa;margin-top:4px">* 추가 후 구글 시트에도 자동 반영됩니다</p>
    </div>
    <div class="modal-form-panel" id="mpanel-promo">
      <div class="form-group"><label>일정명</label><input type="text" id="p-name" placeholder="예) 액막이 퍼퓸바 프로모션"></div>
      <div class="form-row">
        <div class="form-group"><label>시작일</label><input type="date" id="p-start"></div>
        <div class="form-group"><label>종료일</label><input type="date" id="p-end"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>채널</label><select id="p-channel"><option>자사몰</option><option>쿠팡</option><option>올리브영</option><option>스마트스토어</option><option>전사</option><option>기타</option></select></div>
        <div class="form-group"><label>카테고리</label><select id="p-type"><option>프로모션</option><option>기획전</option><option>PPL</option><option>라이브방송</option><option>신제품 출시</option><option>세일</option><option>기타</option></select></div>
      </div>
      <div class="form-group"><label>목표 매출 (없으면 비워두기)</label><input type="text" id="p-goal" placeholder="예) 3억"></div>
      <div class="form-group"><label>메모</label><textarea id="p-memo" rows="2"></textarea></div>
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">취소</button>
      <button class="btn primary" id="submit-btn" onclick="submitModal()">추가</button>
    </div>
  </div>
</div>

<script>
// ── 설정 ────────────────────────────────────────────────────────
const GITHUB_OWNER = 'hayeonhw-dot';
const GITHUB_REPO  = 'work-dashboard';
const GITHUB_TOKEN = '__DASHBOARD_TOKEN__';
const DATA_URL     = 'https://raw.githubusercontent.com/' + GITHUB_OWNER + '/' + GITHUB_REPO + '/main/data.json';
const API_BASE     = 'https://api.github.com/repos/' + GITHUB_OWNER + '/' + GITHUB_REPO + '/contents/';

// ── 상수 ────────────────────────────────────────────────────────
const CHANNEL_TAG={'자사몰':'tag-mall','쿠팡':'tag-coupang','올리브영':'tag-olive','스마트스토어':'tag-store','기타':'tag-etc','CRM':'tag-crm'};
const CHANNEL_COLOR={'자사몰':'#7f77dd','쿠팡':'#378add','올리브영':'#d4537e','스마트스토어':'#1d9e75','기타':'#888780','전사':'#3b5bdb'};
const PROJECT_COLORS={'자사몰 리뉴얼':'#7f77dd','쿠팡 광고 운영':'#378add','올리브영 광고':'#d4537e','CRM 운영':'#e8a020','신제품 런칭':'#e24b4a','기타':'#888780'};

let tasks=[],promos=[],dataSha='';
let currentFilter='all',currentSort='due',currentCalTab='todo',activeModalTab='task';
let calYear=new Date().getFullYear(),calMonth=new Date().getMonth();
const todayDate=new Date();

// ── 날짜 헬퍼 ────────────────────────────────────────────────────
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function addDays(d,n){const r=new Date(d);r.setDate(r.getDate()+n);return r}
function getMon(d){const r=new Date(d);const day=r.getDay();r.setDate(r.getDate()-day+(day===0?-6:1));return r}
const thisMon=getMon(todayDate),thisSun=addDays(thisMon,6);
const lastMon=addDays(thisMon,-7),lastSun=addDays(thisMon,-1);
const nextMon=addDays(thisMon,7),nextSun=addDays(thisMon,13);
function weekOf(ds){if(!ds)return'next';if(ds>=ymd(lastMon)&&ds<=ymd(lastSun))return'last';if(ds>=ymd(thisMon)&&ds<=ymd(thisSun))return'this';if(ds>=ymd(nextMon)&&ds<=ymd(nextSun))return'next';if(ds<ymd(lastMon))return'last';return'next';}
function fmtDue(d){if(!d)return'';if(d===ymd(todayDate))return'오늘';if(d===ymd(addDays(todayDate,1)))return'내일';const dt=new Date(d);const dw=['일','월','화','수','목','금','토'];return(dt.getMonth()+1)+'.'+dt.getDate()+' '+dw[dt.getDay()];}
function isToday(d){return d===ymd(todayDate)}
function isTmr(d){return d===ymd(addDays(todayDate,1))}
function plabel(p){return'🔵'.repeat(Number(p)||0)}
function tagCls(ch){return CHANNEL_TAG[ch]||'tag-etc'}
function fmtWR(mon,sun){const dw=['일','월','화','수','목','금','토'];return(mon.getMonth()+1)+'.'+mon.getDate()+'('+dw[mon.getDay()]+') ~ '+(sun.getMonth()+1)+'.'+sun.getDate()+'('+dw[sun.getDay()]+')'}

// ── 데이터 로딩 ──────────────────────────────────────────────────
async function loadData(){
  try{
    const res=await fetch(DATA_URL+'?t='+Date.now());
    if(!res.ok)throw new Error('HTTP '+res.status);
    const json=await res.json();
    tasks=Array.isArray(json.tasks)?json.tasks:[];
    promos=Array.isArray(json.promos)?json.promos:[];
    // SHA 저장 (업데이트용)
    try{
      const meta=await fetch(API_BASE+'data.json',{headers:{'Authorization':'token '+GITHUB_TOKEN}});
      if(meta.ok)dataSha=(await meta.json()).sha||'';
    }catch(e){}
    document.getElementById('loading-screen').style.display='none';
    document.getElementById('main-app').classList.add('ready');
    renderAll();
  }catch(e){
    document.getElementById('loading-screen').innerHTML='<div style="text-align:center;padding:40px;font-family:sans-serif"><div style="font-size:32px;margin-bottom:12px">😢</div><div style="font-size:14px;color:#e24b4a;margin-bottom:8px">데이터 로딩 실패</div><div style="font-size:12px;color:#aaa">구글 시트에서 \'지금 바로 동기화\'를<br>실행한 뒤 새로고침 해주세요</div><br><button onclick="location.reload()" style="padding:8px 16px;border-radius:8px;border:.5px solid #ddd;background:#fff;cursor:pointer;font-size:13px">새로고침</button></div>';
  }
}

// ── GitHub data.json 저장 ────────────────────────────────────────
async function saveData(){
  const content=JSON.stringify({tasks,promos},null,2);
  const encoded=btoa(unescape(encodeURIComponent(content)));
  const body={message:'대시보드 업데이트 '+new Date().toLocaleString('ko'),content:encoded,branch:'main'};
  if(dataSha)body.sha=dataSha;
  try{
    const res=await fetch(API_BASE+'data.json',{method:'PUT',headers:{'Authorization':'token '+GITHUB_TOKEN,'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(res.ok){const j=await res.json();dataSha=j.content?.sha||dataSha;}
  }catch(e){console.error('저장 실패',e);}
}

// ── Dashboard ────────────────────────────────────────────────────
function renderDashboard(){
  const done=tasks.filter(t=>t.done).length;
  const dueC=tasks.filter(t=>!t.done&&(isToday(t.due)||isTmr(t.due))).length;
  const urgC=tasks.filter(t=>t.urgent&&!t.done).length;
  document.getElementById('m-total').textContent=tasks.length;
  document.getElementById('m-done').textContent=done;
  document.getElementById('m-pct').textContent=tasks.length?Math.round(done/tasks.length*100)+'% 달성':'0%';
  document.getElementById('m-due').textContent=dueC;
  document.getElementById('m-urgent').textContent=urgC;
  let f=[...tasks];
  if(currentFilter==='todo')f=f.filter(t=>!t.done);
  else if(currentFilter==='urgent')f=f.filter(t=>t.urgent||isToday(t.due)||isTmr(t.due));
  else if(currentFilter!=='all')f=f.filter(t=>t.channel===currentFilter);
  if(currentSort==='prio')f.sort((a,b)=>b.prio-a.prio);
  else if(currentSort==='due')f.sort((a,b)=>(a.due||'9999')>(b.due||'9999')?1:-1);
  else f.sort((a,b)=>a.channel>b.channel?1:-1);
  const uEl=document.getElementById('urgent-list'),mEl=document.getElementById('main-list');
  uEl.innerHTML='';mEl.innerHTML='';
  f.forEach(t=>{const el=buildTaskEl(t);if((t.urgent||isToday(t.due)||isTmr(t.due))&&!t.done)uEl.appendChild(el);else mEl.appendChild(el);});
  document.getElementById('channel-stats').innerHTML=['자사몰','쿠팡','올리브영','스마트스토어'].map(ch=>{
    const tot=tasks.filter(t=>t.channel===ch).length,dn=tasks.filter(t=>t.channel===ch&&t.done).length,pct=tot?Math.round(dn/tot*100):0,col=CHANNEL_COLOR[ch]||'#888';
    return'<div class="channel-row"><div class="ch-left"><span class="ch-name">'+ch+'</span><div class="ch-bar-wrap"><div class="ch-bar"><div class="ch-bar-fill" style="width:'+pct+'%;background:'+col+'"></div></div></div></div><span class="ch-count">'+dn+'/'+tot+'</span></div>';
  }).join('');
  document.getElementById('project-summary').innerHTML=['자사몰 리뉴얼','쿠팡 광고 운영','올리브영 광고','CRM 운영','신제품 런칭'].map(p=>{
    const tot=tasks.filter(t=>t.project===p).length,dn=tasks.filter(t=>t.project===p&&t.done).length,col=PROJECT_COLORS[p]||'#888';
    return'<div class="channel-row"><span class="ch-name" style="font-size:13px">'+p+'</span><span class="tag" style="background:'+col+'22;color:'+col+';font-size:11px">'+dn+'/'+tot+'</span></div>';
  }).join('');
}

function buildTaskEl(t){
  const urg=t.urgent||isToday(t.due)||isTmr(t.due);
  const div=document.createElement('div');
  div.className='task'+(t.done?' done':'')+(urg&&!t.done?' urgent':'');
  const tc=(isToday(t.due)||isTmr(t.due))&&!t.done?' today':'';
  div.innerHTML='<div class="checkbox'+(t.done?' checked':'')+'" onclick="toggleDone('+t.id+')">'+(t.done?'<i class="ti ti-check" style="font-size:10px;color:#fff"></i>':'')+'</div><div class="task-body"><div class="task-title'+(t.done?' done':'')+'">'+t.title+'</div><div class="task-meta"><span class="tag '+tagCls(t.channel)+'">'+t.channel+'</span><span class="tag tag-etc" style="font-size:10px">'+t.project+'</span>'+(t.due?'<span class="due'+tc+'"><i class="ti ti-clock" style="font-size:10px"></i> '+fmtDue(t.due)+'</span>':'')+(t.urgent&&!t.done?'<span class="urgent-badge">긴급</span>':'')+'</div></div><span class="prio">'+plabel(t.prio)+'</span>';
  return div;
}

// ── Weekly Report ────────────────────────────────────────────────
function renderProjects(){
  document.getElementById('week-range-label').textContent='저번주 '+fmtWR(lastMon,lastSun)+' · 이번주 '+fmtWR(thisMon,thisSun);
  const allProjects=[...new Set(tasks.map(t=>t.project))];
  const el=document.getElementById('project-list');el.innerHTML='';
  allProjects.forEach(pName=>{
    const pt=tasks.filter(t=>t.project===pName);
    const color=PROJECT_COLORS[pName]||'#888780';
    const channels=[...new Set(pt.map(t=>t.channel))];
    const lastWk=pt.filter(t=>weekOf(t.due)==='last');
    const thisWk=pt.filter(t=>weekOf(t.due)==='this');
    const nextWk=pt.filter(t=>weekOf(t.due)==='next');
    const doneCnt=pt.filter(t=>t.done).length;
    const pct=pt.length?Math.round(doneCnt/pt.length*100):0;
    const blockers=pt.filter(t=>t.blocker&&!t.done);
    const chTags=channels.map(ch=>'<span class="pj-channel-tag tag '+tagCls(ch)+'">'+ch+'</span>').join('');
    function trHtml(t){const tc=(isToday(t.due)||isTmr(t.due))&&!t.done?' today':'';return'<div class="pj-task-row"><div class="pj-cb'+(t.done?' checked':'')+'" onclick="toggleDone('+t.id+')">'+(t.done?'<i class="ti ti-check" style="font-size:9px;color:#fff"></i>':'')+'</div><div style="flex:1;min-width:0"><div class="pj-task-text'+(t.done?' done':'')+'">'+t.title+'</div><div class="pj-task-meta">'+(t.due?'<span class="pj-due'+tc+'">'+fmtDue(t.due)+'</span>':'')+(t.urgent&&!t.done?'<span class="pj-urgent">긴급</span>':'')+'</div></div><span style="font-size:11px;color:#ccc;flex-shrink:0">'+plabel(t.prio)+'</span></div>';}
    const card=document.createElement('div');card.className='pj-block';
    card.innerHTML='<div class="pj-head" onclick="togglePj(this)"><div class="pj-head-left"><div class="pj-color-dot" style="background:'+color+'"></div><span class="pj-name">'+pName+'</span>'+chTags+'</div><div class="pj-head-right"><div class="pj-prog-bar"><div class="pj-prog-fill" style="width:'+pct+'%;background:'+color+'"></div></div><span class="pj-pct">'+pct+'%</span><i class="ti ti-chevron-down chevron open"></i></div></div><div class="pj-body"><div class="pj-cols"><div class="pj-col"><div class="pj-col-title last-week"><i class="ti ti-check" style="font-size:12px"></i> 저번 주 한 일</div>'+(lastWk.length?lastWk.map(trHtml).join(''):'<div class="pj-empty">없음</div>')+'</div><div class="pj-col"><div class="pj-col-title this-week"><i class="ti ti-loader" style="font-size:12px"></i> 이번 주 할 일</div>'+(thisWk.length?thisWk.map(trHtml).join(''):'<div class="pj-empty">없음</div>')+'<div class="pj-add-row" onclick="openModalForProject(\''+pName+'\')"><i class="ti ti-plus" style="font-size:12px"></i> 추가</div></div><div class="pj-col"><div class="pj-col-title next-week"><i class="ti ti-arrow-right" style="font-size:12px"></i> 다음 주 할 일</div>'+(nextWk.length?nextWk.map(trHtml).join(''):'<div class="pj-empty">없음</div>')+'</div></div>'+(blockers.length?'<div class="pj-blocker"><i class="ti ti-alert-triangle" style="font-size:13px"></i> <strong>블로커</strong>: '+blockers.map(t=>t.blocker).join(' / ')+'</div>':'')+'</div>';
    el.appendChild(card);
  });
}

// ── Calendar ─────────────────────────────────────────────────────
function renderCalHdr(id){const days=['일','월','화','수','목','금','토'];document.getElementById(id).innerHTML=days.map((d,i)=>'<div class="cal-day-header" style="'+(i===0||i===6?'color:#e24b4a':'')+'">'+d+'</div>').join('');}
function dToYMD(y,m,d){return y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0')}
function renderTodoCal(){
  renderCalHdr('cal-headers-todo');
  const firstDay=new Date(calYear,calMonth,1).getDay(),lastDate=new Date(calYear,calMonth+1,0).getDate();
  const bEl=document.getElementById('cal-body-todo');bEl.innerHTML='';
  for(let i=0;i<firstDay;i++){const e=document.createElement('div');e.className='cal-cell empty';bEl.appendChild(e);}
  for(let d=1;d<=lastDate;d++){
    const ds=dToYMD(calYear,calMonth,d);
    const isT=todayDate.getFullYear()===calYear&&todayDate.getMonth()===calMonth&&todayDate.getDate()===d;
    const dow=(firstDay+d-1)%7;
    const dt=tasks.filter(t=>t.due===ds);
    const e=document.createElement('div');
    e.className='cal-cell'+(isT?' today':'')+(dow===0?' sun':dow===6?' sat':'');
    const show=dt.slice(0,3);const more=dt.length-3;
    e.innerHTML='<div class="cal-day-num">'+d+'</div>'+show.map(t=>{const col=CHANNEL_COLOR[t.channel]||'#888';return'<div class="todo-dot" style="background:'+col+'18;color:'+col+'" title="'+t.title+'">'+t.title.replace(/\[.*?\]\s*/,'').slice(0,14)+'</div>';}).join('')+(more>0?'<div class="cal-more">+'+more+'개</div>':'');
    bEl.appendChild(e);
  }
}
function getPromoColor(p){if(!p.goal)return'#bbbbbb';return CHANNEL_COLOR[p.channel]||'#3b5bdb'}
function renderPromoCal(){
  renderCalHdr('cal-headers-promo');
  const firstDay=new Date(calYear,calMonth,1).getDay(),lastDate=new Date(calYear,calMonth+1,0).getDate();
  const bEl=document.getElementById('cal-body-promo');bEl.innerHTML='';
  for(let i=0;i<firstDay;i++){const e=document.createElement('div');e.className='cal-cell empty';bEl.appendChild(e);}
  for(let d=1;d<=lastDate;d++){
    const ds=dToYMD(calYear,calMonth,d);
    const isT=todayDate.getFullYear()===calYear&&todayDate.getMonth()===calMonth&&todayDate.getDate()===d;
    const dow=(firstDay+d-1)%7;
    const active=promos.filter(p=>p.start<=ds&&p.end>=ds);
    const e=document.createElement('div');
    e.className='cal-cell'+(isT?' today':'')+(dow===0?' sun':dow===6?' sat':'');
    const show=active.slice(0,3);const more=active.length-3;
    e.innerHTML='<div class="cal-day-num">'+d+'</div>'+show.map(p=>{const color=getPromoColor(p);const isStart=p.start===ds,isEnd=p.end===ds;const cls=isStart&&isEnd?'solo':isStart?'start':isEnd?'end':'middle';return'<div class="promo-bar '+cls+'" style="background:'+color+'22;color:'+color+';border-left:'+(isStart?'3px solid '+color:'none')+';opacity:'+(p.goal?1:0.55)+'" onclick="showPromoDetail('+p.id+')" title="'+p.name+'">'+(isStart?p.name.slice(0,12):'\u00a0')+'</div>';}).join('')+(more>0?'<div class="cal-more">+'+more+'개</div>':'');
    bEl.appendChild(e);
  }
}
function showPromoDetail(id){
  const p=promos.find(x=>x.id===id);if(!p)return;
  const color=getPromoColor(p);
  const panel=document.getElementById('promo-detail-panel');panel.className='promo-detail open';
  panel.innerHTML='<div class="promo-detail-header"><div><div style="display:flex;align-items:center;gap:8px;margin-bottom:5px"><div style="width:11px;height:11px;border-radius:3px;background:'+color+'"></div><span class="promo-detail-title">'+p.name+'</span><span class="goal-badge '+(p.goal?'goal-yes':'goal-no')+'">'+(p.goal?'🎯 목표 있음':'참고용')+'</span></div><div style="font-size:12px;color:#aaa">'+p.type+' · '+p.channel+'</div></div><button class="promo-detail-close" onclick="closePromoDetail()"><i class="ti ti-x"></i></button></div><div class="promo-detail-grid"><div class="promo-kv"><div class="k">기간</div><div class="v">'+p.start.slice(5)+' ~ '+p.end.slice(5)+'</div></div><div class="promo-kv"><div class="k">목표 매출</div><div class="v goal">'+(p.goal||'설정 없음')+'</div></div><div class="promo-kv"><div class="k">채널</div><div class="v">'+p.channel+'</div></div>'+(p.memo?'<div class="promo-kv" style="grid-column:1/-1"><div class="k">메모</div><div class="v" style="font-weight:400">'+p.memo+'</div></div>':'')+'</div>';
}
function closePromoDetail(){document.getElementById('promo-detail-panel').className='promo-detail';}
function renderCalendar(){
  const months=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  document.getElementById('cal-title').textContent=calYear+'년 '+months[calMonth];
  if(currentCalTab==='todo')renderTodoCal();else renderPromoCal();
}

// ── Actions ──────────────────────────────────────────────────────
async function toggleDone(id){
  const t=tasks.find(t=>t.id===id);if(!t)return;
  t.done=!t.done;renderAll();
  await saveData();
}
function togglePj(header){const body=header.nextElementSibling;const chev=header.querySelector('.chevron');const open=!body.classList.contains('collapsed');body.classList.toggle('collapsed',open);chev.classList.toggle('open',!open);}
function filterDash(type,btn){currentFilter=type;document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');renderDashboard();}
function sortTasks(val){currentSort=val;renderDashboard();}
function switchTab(tab,btn){document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));btn.classList.add('active');['dashboard','projects','calendar'].forEach(t=>document.getElementById('tab-'+t).classList.toggle('hidden',t!==tab));if(tab==='calendar')renderCalendar();if(tab==='projects')renderProjects();}
function switchCalTab(tab,btn){currentCalTab=tab;document.querySelectorAll('.subtab').forEach(b=>b.classList.remove('active'));btn.classList.add('active');document.getElementById('cal-todo').classList.toggle('hidden',tab!=='todo');document.getElementById('cal-promo').classList.toggle('hidden',tab!=='promo');renderCalendar();}
function changeMonth(dir){calMonth+=dir;if(calMonth<0){calMonth=11;calYear--;}if(calMonth>11){calMonth=0;calYear++;}renderCalendar();}
function openModal(tab){
  document.getElementById('f-due').value=ymd(todayDate);document.getElementById('f-title').value='';document.getElementById('f-blocker').value='';
  document.getElementById('p-name').value='';document.getElementById('p-goal').value='';document.getElementById('p-memo').value='';
  document.getElementById('p-start').value=ymd(todayDate);document.getElementById('p-end').value=ymd(addDays(todayDate,7));
  switchModalTab(tab||'task',document.getElementById('mtab-'+(tab||'task')));
  document.getElementById('modal').classList.add('open');
  setTimeout(()=>document.getElementById('f-title').focus(),120);
}
function openModalForProject(pName){openModal('task');document.getElementById('f-project').value=pName;document.getElementById('f-due').value=ymd(nextMon);}
function closeModal(){document.getElementById('modal').classList.remove('open');}
function closeModalOutside(e){if(e.target===document.getElementById('modal'))closeModal();}
function switchModalTab(tab,btn){activeModalTab=tab;document.querySelectorAll('.modal-tab').forEach(b=>b.classList.remove('active'));btn.classList.add('active');document.querySelectorAll('.modal-form-panel').forEach(p=>p.classList.remove('active'));document.getElementById('mpanel-'+tab).classList.add('active');}
async function submitModal(){
  const btn=document.getElementById('submit-btn');btn.textContent='저장 중...';btn.disabled=true;
  try{
    const newId=Date.now();
    if(activeModalTab==='task'){
      const title=document.getElementById('f-title').value.trim();if(!title){alert('업무 내용을 입력해주세요');btn.textContent='추가';btn.disabled=false;return;}
      tasks.push({id:newId,title,channel:document.getElementById('f-channel').value,project:document.getElementById('f-project').value,due:document.getElementById('f-due').value,prio:parseInt(document.getElementById('f-prio').value),done:false,urgent:document.getElementById('f-urgent').value==='true',blocker:document.getElementById('f-blocker').value.trim()});
    }else{
      const name=document.getElementById('p-name').value.trim();if(!name){alert('일정명을 입력해주세요');btn.textContent='추가';btn.disabled=false;return;}
      promos.push({id:newId,name,channel:document.getElementById('p-channel').value,type:document.getElementById('p-type').value,start:document.getElementById('p-start').value,end:document.getElementById('p-end').value,goal:document.getElementById('p-goal').value.trim(),memo:document.getElementById('p-memo').value.trim()});
    }
    await saveData();
    closeModal();renderAll();
  }catch(e){alert('저장 실패: '+e.message);}
  btn.textContent='추가';btn.disabled=false;
}
function renderAll(){
  renderDashboard();
  if(!document.getElementById('tab-projects').classList.contains('hidden'))renderProjects();
  if(!document.getElementById('tab-calendar').classList.contains('hidden'))renderCalendar();
}

// ── 초기화 ───────────────────────────────────────────────────────

document.getElementById('today-label').textContent=todayDate.getFullYear()+'년 '+(todayDate.getMonth()+1)+'월 '+todayDate.getDate()+'일 ('+dw[todayDate.getDay()]+')';
loadData();
</script>
